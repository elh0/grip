[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "grip-coach-worker"
version = "0.1.0"
description = "grip analysis worker: frames, pose, sport rules, Claude critique"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
pose = ["mediapipe>=0.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
coach-worker = "coach_worker.main:run"
grip-coach = "coach_worker.cli:main"

[tool.setuptools.packages.find]
include = ["coach_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
